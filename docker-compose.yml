services:
  db:
    image: postgres:17
    container_name: siembra-abierta-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: siembra
      POSTGRES_PASSWORD: siembra
      POSTGRES_DB: siembra_abierta
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U siembra -d siembra_abierta']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
